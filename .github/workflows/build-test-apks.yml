          grep -Fq 'if (deps.batteryMeter.pulseDayNow()) deps.motion.earlyWakePulse { walking ->' core/src/main/java/com/openzeekr/app/ble/ProximityService.kt
          test -f core/src/test/java/com/openzeekr/app/ble/OwnStepLogicTest.kt
          test -f core/src/test/java/com/openzeekr/app/util/BatteryLedgerTest.kt
          # 0.3.23 (owner approval 21/10): full climate sheet after the stock app — quick cool/heat
          # presets, remembered run times on A/C + seats + wheel, range Lo..Hi, Parking Comfort greyed.
          grep -Fq 'internal const val AC_TEMP_MIN = 17.0' app/src/main/java/com/openzeekr/app/ui/ClimatePrefs.kt
          grep -Fq 'internal val DURATION_CHOICES = listOf(5, 10, 15, 20, 30, 45, 60)' app/src/main/java/com/openzeekr/app/ui/ClimatePrefs.kt
          grep -Fq 'QuickClimateButton("Quick cool", Icons.Filled.AcUnit, Brand.accent, Modifier.weight(1f)) { quickSet(AC_TEMP_MIN) }' app/src/main/java/com/openzeekr/app/ui/VehicleScreen.kt
          grep -Fq 'Text("Parking Comfort Mode", fontWeight = FontWeight.SemiBold, fontSize = 14.sp, color = Brand.muted)' app/src/main/java/com/openzeekr/app/ui/VehicleScreen.kt
          grep -Fq 'ServiceParameter("SH.$pos.duration", durationMin.toString()), ServiceParameter("SV.$pos", "false"),' app/src/main/java/com/openzeekr/app/ui/VehicleScreen.kt
          grep -Fq 'deps.control.send(Command.AC_ON, savedAcExtras(ctx))' app/src/main/java/com/openzeekr/app/ui/ControlsScreen.kt
          # 0.3.24 (owner approval 21/10): read-only control-state dump so a stock-app toggle (Parking
          # Comfort) can be matched to the flag it flips; never actuates, nothing written to the export.
          grep -Fq 'suspend fun observeControlState(): String' core/src/main/java/com/openzeekr/app/remote/Repositories.kt
          grep -Fq 'status = deps.control.observeControlState()' app/src/main/java/com/openzeekr/app/ui/SettingsScreen.kt
          # 0.3.25 (owner approval 22/10): a proof window's first fix is held to the position this visit last knew
          # for certain - no displacement at all for a phone that reported no motion and no step since (simulator
          # F49: a jump straddling two windows locked the car at 4 m) - and the windows of a visit share that memory.
          grep -Fq 'internal class DepartureFixMemory(anchor: DepartureFix, stepsAtAnchor: Long?)' core/src/main/java/com/openzeekr/app/ble/DepartureObservationWindow.kt
          grep -Fq 'outcome = "departure_fix_implausible"' core/src/main/java/com/openzeekr/app/ble/DepartureObservationWindow.kt
          grep -Fq 'fun implausibleDisplacement(known: DepartureFix, fix: DepartureFix, motionless: Boolean): Boolean' core/src/main/java/com/openzeekr/app/ble/DepartureSafetyEvidence.kt
          grep -Fq 'internal fun distanceM(a: DepartureFix, b: DepartureFix): Double' core/src/main/java/com/openzeekr/app/ble/DepartureSafetyEvidence.kt
          grep -Fq 'memory = departureMemory, lastMotionAtMs = ::lastMotionAt' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'departureMemory = DepartureFixMemory(fix, stepsForDepartureProof())' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'fun aJumpAlreadyActiveAtTheFirstFixOfAMotionlessPhoneIsQuarantined()' core/src/test/java/com/openzeekr/app/ble/DepartureObservationWindowTest.kt
          # 0.3.26 (owner approval 22/10): the measurement lines of 0.3.22 reach the persistent journal (own tracker
          # window, battery day; counts only); the export names its log sources and merges logcat with the buffer.
          grep -Fq 'return "OWN_WINDOW reason=' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt
          grep -Fq 'return "BATTERY_DAY ${it.groupValues[1]}"' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt
          grep -Fq '"departure_fix_implausible")' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt
          grep -Fq 'append("Bronnen: ")' core/src/main/java/com/openzeekr/app/util/DiagnosticExport.kt
          grep -Fq 'val appLog = fromLogcat + buffer.filterNot { it in seen }' app/src/main/java/com/openzeekr/app/ui/LogShare.kt
          grep -Fq 'fun measurementLinesOfTheOwnTrackerAndTheBatteryDayAreCountsOnly()' core/src/test/java/com/openzeekr/app/util/ProximityDiagnosticJournalTest.kt

      - name: Verify read-only diagnostic entry point
        run: |
          grep -Fq 'Text(if (observingCapabilities) "Reading vehicle capabilities…" else "Read vehicle capabilities")' app/src/main/java/com/openzeekr/app/ui/SettingsScreen.kt
          grep -Fq 'vehicleCapabilityDiagnostic()' core/src/main/java/com/openzeekr/app/remote/Repositories.kt
          grep -Fq 'VEHICLE_CAPABILITIES' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt

      - name: Verify permanent phone signing identity
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          EXPECTED="96f1627b1da334cb443596b1746bcce390750f1db751ec2bf371e82d323b45b9"
          APK=app/build/outputs/apk/debug/app-debug.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fqi "certificate SHA-256 digest: $EXPECTED"

      - name: Verify built phone APK identity and SHA-256
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.openzeekr.app.test' versionCode='150' versionName='0.3.26-work'"
          printf '%s\n' "$BADGING" | grep -E "^application: label='ZeekRemote' icon='[^']*ic_launcher_profiel[^']*'"
          printf '%s\n' "$BADGING" | grep -Fx "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fx "targetSdkVersion:'34'"
          sha256sum "$APK"

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeekRemote-phone-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
