name: Build ZeekRemote test APKs

on:
  workflow_dispatch:
  push:
    branches:
      - zeekremote-proximity-recovery
      - zeekremote-fast-approach-prototype
      - zeekremote-0.1.40-proximity-safety
      - zeekremote-0.1.41-lock-verification
      - zeekremote-0.1.42-near-lock-safety
      - zeekremote-0.1.43-lock-observation
      - zeekremote-0.1.44-departure-evidence
      - zeekremote-0.1.45-anchor-recovery
      - zeekremote-0.1.46-location-diagnostics
      - zeekremote-0.1.47-relock-arrival-journal
      - zeekremote-0.1.48-near-anchor-acquisition
      - zeekremote-0.1.49-departure-location-window
      - zeekremote-0.1.50-protocol-diagnostics
      - zeekremote-0.1.51-fresh-rssi
      - zeekremote-0.1.52-ble-departure
      - zeekremote-0.1.53-lock-alarm
      - zeekremote-0.1.54-departure-alarm
      - zeekremote-0.1.55-alarm-episode
      - zeekremote-0.1.56-manual-return
      - zeekremote-0.1.57-upstream-fixes
      - zeekremote-0.1.58-session-renewal
      - zeekremote-0.1.59-key-survives-kickout
      - zeekremote-0.1.60-self-lock
      - zeekremote-0.1.61-return-after-lock

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The private TEST key lives only in the encrypted GitHub Actions secret below. Never replace
      # that secret: doing so forces users to uninstall and destroys the provisioned Digital Key.
      - name: Install permanent ZeekRemote test signing key
        env:
          TEST_KEYSTORE_B64: ${{ secrets.ZEEKREMOTE_TEST_KEYSTORE_B64 }}
        run: |
          test -n "$TEST_KEYSTORE_B64"
          mkdir -p ~/.android
          printf '%s' "$TEST_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          printf '%s\n' \
            "storeFile=$HOME/.android/debug.keystore" \
            'storePassword=android' \
            'keyAlias=androiddebugkey' \
            'keyPassword=android' \
            'storeType=JKS' > keystore.properties
          ACTUAL=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p')
          test "$ACTUAL" = "96:F1:62:7B:1D:A3:34:CB:44:35:96:B1:74:6B:CC:E3:90:75:0F:1D:B7:51:EC:2B:F3:71:E8:2D:32:3B:45:B9"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install official EU xchanger signing secret
        env:
          XCHANGER_SIGN_SECRET: ${{ secrets.ZEEKREMOTE_XCHANGER_SIGN_SECRET }}
        run: |
          test -n "$XCHANGER_SIGN_SECRET"
          printf 'XCHANGER_SIGN_SECRET=%s\n' "$XCHANGER_SIGN_SECRET" > secrets.properties
          chmod 600 secrets.properties

      - name: Test core and build phone APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Verify departure location foreground service is packaged
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk \
            | grep -F 'android.permission.FOREGROUND_SERVICE_LOCATION'
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml \
            | grep -F 'android:foregroundServiceType' | grep -F '(type 0x11)0x18'

      - name: Verify Crystal White 7GT hero is packaged and defaulted
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/cars/car_7gt.png'
          grep -A2 'CarModel("7GT"' app/src/main/java/com/openzeekr/app/ui/CarCatalog.kt | grep -q 'PaintColor("Crystal White"'

      - name: Verify conditional automatic Lock instructions on both proximity screens
        run: |
          grep -Fq 'Auto Lock needs verified departure: Bluetooth signal plus walking (sensitivity Far) or phone location. If an expected Lock is not confirmed, an alarm sounds: Lock manually and check the car.' app/src/main/java/com/openzeekr/app/ui/SetupScreen.kt
          grep -Fq 'Auto Lock needs verified departure: Bluetooth signal plus walking (sensitivity Far) or phone location. If an expected Lock is not confirmed, an alarm sounds: Lock manually and check the car.' app/src/main/java/com/openzeekr/app/ui/ControlsScreen.kt
          grep -Fq 'AutomaticLockGate(AutomaticLockGate.Mode.ACTUATE)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'DepartureSafetyEvidence.confirmsDeparture(anchor, previous, current, steps, nowMs)' core/src/main/java/com/openzeekr/app/ble/DepartureObservationWindow.kt
          grep -Fq 'departureLocationSource.nearAnchor(nearAnchor)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq '.setDurationMillis(NearDepartureAnchor.WINDOW_MS)' core/src/main/java/com/openzeekr/app/ble/DepartureLocationSource.kt
          grep -Fq '.setDurationMillis(DepartureObservationWindow.WINDOW_MS)' core/src/main/java/com/openzeekr/app/ble/DepartureLocationSource.kt
          grep -Fq 'departureLocationSource.confirmsDeparture(anchor, steps = {' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq '"Automatic Lock unavailable"' core/src/main/java/com/openzeekr/app/ble/UnverifiedLockNotifier.kt
          grep -Fq 'bleRoute = BleDepartureRoute.forLockThreshold(store.current().sensitivityLockRssi)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'if ((reason == "ble-departure" || lastStrongNearAtMs > departureProofAtMs ||' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'departure = { confirmPhysicalDeparture() },' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'const val CALIBRATED_LOCK_RSSI = -82' core/src/main/java/com/openzeekr/app/ble/BleDepartureRoute.kt
          grep -Fq 'USAGE_ALARM' core/src/main/java/com/openzeekr/app/ble/UnverifiedLockNotifier.kt
          grep -Fq 'Event.DEPARTURE_UNVERIFIED -> true' core/src/main/java/com/openzeekr/app/ble/LockAlertPolicy.kt
          grep -Fq 'LockAlertPolicy.linkLossEvent(movedDuringLoss, departureSuspected())' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'armDepartureAlarm()' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'LinkedApproachWatch.holdAwake(ble.state.value == DkBleManager.State.SESSION_READY,' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'door(lockView.tapLocks)' app/src/main/java/com/openzeekr/app/ui/VehicleScreen.kt
          grep -Fq '!bleLockAuthorized() && !confirmPhysicalDeparture()' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'const val MIN_WEAK_MS = 8_000L' core/src/main/java/com/openzeekr/app/ble/BleDepartureEvidence.kt

      - name: Verify read-only diagnostic entry point
        run: |
          grep -Fq 'Text(if (observingCapabilities) "Reading vehicle capabilities…" else "Read vehicle capabilities")' app/src/main/java/com/openzeekr/app/ui/SettingsScreen.kt
          grep -Fq 'vehicleCapabilityDiagnostic()' core/src/main/java/com/openzeekr/app/remote/Repositories.kt
          grep -Fq 'VEHICLE_CAPABILITIES' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt

      - name: Verify permanent phone signing identity
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          EXPECTED="96f1627b1da334cb443596b1746bcce390750f1db751ec2bf371e82d323b45b9"
          APK=app/build/outputs/apk/debug/app-debug.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fqi "certificate SHA-256 digest: $EXPECTED"

      - name: Verify built phone APK identity and SHA-256
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.openzeekr.app.test' versionCode='99' versionName='0.1.61-work'"
          printf '%s\n' "$BADGING" | grep -Fx "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fx "targetSdkVersion:'34'"
          sha256sum "$APK"

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeekRemote-phone-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
