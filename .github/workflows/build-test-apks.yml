name: Build ZeekRemote test APKs

on:
  workflow_dispatch:
  push:
    branches:
      - zeekremote-proximity-recovery

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The private TEST key lives only in the encrypted GitHub Actions secret below. Never replace
      # that secret: doing so forces users to uninstall and destroys the provisioned Digital Key.
      - name: Install permanent ZeekRemote test signing key
        env:
          TEST_KEYSTORE_B64: ${{ secrets.ZEEKREMOTE_TEST_KEYSTORE_B64 }}
        run: |
          test -n "$TEST_KEYSTORE_B64"
          mkdir -p ~/.android
          printf '%s' "$TEST_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          printf '%s\n' \
            "storeFile=$HOME/.android/debug.keystore" \
            'storePassword=android' \
            'keyAlias=androiddebugkey' \
            'keyPassword=android' \
            'storeType=JKS' > keystore.properties
          ACTUAL=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p')
          test "$ACTUAL" = "96:F1:62:7B:1D:A3:34:CB:44:35:96:B1:74:6B:CC:E3:90:75:0F:1D:B7:51:EC:2B:F3:71:E8:2D:32:3B:45:B9"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build phone and watch APKs
        run: ./gradlew :core:test :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Verify Crystal White 7GT hero is packaged and defaulted
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/cars/car_7gt.png'
          grep -A2 'CarModel("7GT"' app/src/main/java/com/openzeekr/app/ui/CarCatalog.kt | grep -q 'PaintColor("Crystal White"'

      - name: Verify permanent phone and watch signing identity
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          EXPECTED="96f1627b1da334cb443596b1746bcce390750f1db751ec2bf371e82d323b45b9"
          for APK in app/build/outputs/apk/debug/app-debug.apk wear/build/outputs/apk/debug/wear-debug.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            printf '%s\n' "$CERTS"
            printf '%s\n' "$CERTS" | grep -Fqi "certificate SHA-256 digest: $EXPECTED"
          done

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeekRemote-phone-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeekRemote-watch-test
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
