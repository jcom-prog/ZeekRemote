name: Build ZeekRemote test APKs

on:
  workflow_dispatch:
  push:
    branches:
      - zeekremote-proximity-recovery
      - zeekremote-fast-approach-prototype
      - zeekremote-0.1.40-proximity-safety
      - zeekremote-0.1.41-lock-verification
      - zeekremote-0.1.42-near-lock-safety
      - zeekremote-0.1.43-lock-observation
      - zeekremote-0.1.44-departure-evidence
      - zeekremote-0.1.45-anchor-recovery
      - zeekremote-0.1.46-location-diagnostics
      - zeekremote-0.1.47-relock-arrival-journal
      - zeekremote-0.1.48-near-anchor-acquisition
      - zeekremote-0.1.49-departure-location-window
      - zeekremote-0.1.50-protocol-diagnostics
      - zeekremote-0.1.51-fresh-rssi
      - zeekremote-0.1.52-ble-departure
      - zeekremote-0.1.53-lock-alarm
      - zeekremote-0.1.54-departure-alarm
      - zeekremote-0.1.55-alarm-episode
      - zeekremote-0.1.56-manual-return
      - zeekremote-0.1.57-upstream-fixes
      - zeekremote-0.1.58-session-renewal
      - zeekremote-0.1.59-key-survives-kickout
      - zeekremote-0.1.60-self-lock
      - zeekremote-0.1.61-return-after-lock
      - zeekremote-0.1.62-linked-watch
      - zeekremote-0.1.63-sim-fixes
      - zeekremote-0.1.64-return-jitter
      - zeekremote-0.1.65-manual-lock-10m
      - zeekremote-0.1.66-manual-lock-return
      - zeekremote-0.1.67-return-backstop
      - zeekremote-0.2.0
      - zeekremote-0.2.1-reopen-detect
      - zeekremote-0.2.2-auto-lock-return
      - zeekremote-0.2.3-lock-verify
      - zeekremote-0.2.4-deep-far-departure
      - zeekremote-0.2.5-short-stops-cloud
      - zeekremote-0.2.6-presence-selflock
      - zeekremote-0.2.7-key-awake-status
      - zeekremote-0.2.8-trip-consumption
      - zeekremote-0.2.9-consumption-diag
      - zeekremote-0.2.10-journey-shared
      - zeekremote-0.2.11-trips-charge
      - zeekremote-0.2.12-share-diagnostics
      - zeekremote-0.2.13-faster-cloud-lock
      - zeekremote-0.2.14-return-reopen
      - zeekremote-0.2.15-own-key
      - zeekremote-0.2.16-edge-of-range
      - zeekremote-0.2.17-step-counter
      - zeekremote-0.3.0-safety
      - zeekremote-0.3.1-calibration
      - zeekremote-0.3.2-approach
      - zeekremote-0.3.3-icons
      - zeekremote-0.3.4-cleanup
      - zeekremote-0.3.5-privacy

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The private TEST key lives only in the encrypted GitHub Actions secret below. Never replace
      # that secret: doing so forces users to uninstall and destroys the provisioned Digital Key.
      - name: Install permanent ZeekRemote test signing key
        env:
          TEST_KEYSTORE_B64: ${{ secrets.ZEEKREMOTE_TEST_KEYSTORE_B64 }}
        run: |
          test -n "$TEST_KEYSTORE_B64"
          mkdir -p ~/.android
          printf '%s' "$TEST_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          printf '%s\n' \
            "storeFile=$HOME/.android/debug.keystore" \
            'storePassword=android' \
            'keyAlias=androiddebugkey' \
            'keyPassword=android' \
            'storeType=JKS' > keystore.properties
          ACTUAL=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p')
          test "$ACTUAL" = "96:F1:62:7B:1D:A3:34:CB:44:35:96:B1:74:6B:CC:E3:90:75:0F:1D:B7:51:EC:2B:F3:71:E8:2D:32:3B:45:B9"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install official EU xchanger signing secret
        env:
          XCHANGER_SIGN_SECRET: ${{ secrets.ZEEKREMOTE_XCHANGER_SIGN_SECRET }}
        run: |
          test -n "$XCHANGER_SIGN_SECRET"
          printf 'XCHANGER_SIGN_SECRET=%s\n' "$XCHANGER_SIGN_SECRET" > secrets.properties
          chmod 600 secrets.properties

      - name: Test core and build phone APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      # Fase 0 (14/10): the whole-app simulator (calibrated + stress worlds) must not show more
      # SAFETY findings than core/src/test/resources/sim-baseline.json allows; 0.3.2: nor clearly
      # more COMFORT findings (late/missing unlock or lock), with 20 learning visits per run so
      # the self-calibration is active as on the phone, and 15 % flat final approaches (field
      # 14/10 18:31: the late unlock no simulation showed).
      - name: Simulation safety gate
        run: SIM_GATE=1 SIM_LEARN_VISITS=20 SIM_PLATEAU_P=0.15 ./gradlew :core:testDebugUnitTest --tests "com.openzeekr.app.ble.sim.SimGateTest" --stacktrace

      - name: Upload simulation gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeekRemote-sim-gate
          path: core/build/sim-gate/
          if-no-files-found: ignore

      - name: Verify departure location foreground service is packaged
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk \
            | grep -F 'android.permission.FOREGROUND_SERVICE_LOCATION'
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml \
            | grep -F 'android:foregroundServiceType' | grep -F '(type 0x11)0x18'

      - name: Verify Crystal White 7GT hero is packaged and defaulted
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/cars/car_7gt.png'
          grep -A2 'CarModel("7GT"' app/src/main/java/com/openzeekr/app/ui/CarCatalog.kt | grep -q 'PaintColor("Crystal White"'

      - name: Verify conditional automatic Lock instructions on both proximity screens
        run: |
          grep -Fq 'Auto Lock needs verified departure: Bluetooth signal plus walking, or phone location. If an expected Lock is not confirmed, an alarm sounds: Lock manually and check the car.' app/src/main/java/com/openzeekr/app/ui/SetupScreen.kt
          grep -Fq 'Auto Lock needs verified departure: Bluetooth signal plus walking, or phone location. If an expected Lock is not confirmed, an alarm sounds: Lock manually and check the car.' app/src/main/java/com/openzeekr/app/ui/ControlsScreen.kt
          grep -Fq 'AutomaticLockGate(AutomaticLockGate.Mode.ACTUATE)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'DepartureSafetyEvidence.confirmsDeparture(anchor, previous, current, steps, nowMs, bleCorroborated)' core/src/main/java/com/openzeekr/app/ble/DepartureObservationWindow.kt
          grep -Fq 'departureLocationSource.nearAnchor(nearAnchor)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq '.setDurationMillis(NearDepartureAnchor.WINDOW_MS)' core/src/main/java/com/openzeekr/app/ble/DepartureLocationSource.kt
          grep -Fq '.setDurationMillis(DepartureObservationWindow.WINDOW_MS)' core/src/main/java/com/openzeekr/app/ble/DepartureLocationSource.kt
          grep -Fq 'departureLocationSource.confirmsDeparture(anchor, steps = {' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq '"Automatic Lock unavailable"' core/src/main/java/com/openzeekr/app/ble/UnverifiedLockNotifier.kt
          grep -Fq 'bleRoute = BleDepartureRoute.forLockThreshold(config().sensitivityLockRssi)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'if ((reason == "ble-departure" || lastStrongNearAtMs > departureProofAtMs ||' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'bleProofFresh || confirmPhysicalDeparture()' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val BLE_PROOF_CLOUD_MS = 30_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'const val CALIBRATED_LOCK_RSSI = -82' core/src/main/java/com/openzeekr/app/ble/BleDepartureRoute.kt
          grep -Fq 'USAGE_ALARM' core/src/main/java/com/openzeekr/app/ble/UnverifiedLockNotifier.kt
          grep -Fq 'Event.DEPARTURE_UNVERIFIED -> true' core/src/main/java/com/openzeekr/app/ble/LockAlertPolicy.kt
          grep -Fq 'LockAlertPolicy.linkLossEvent(movedDuringLoss, departureSuspected())' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'armDepartureAlarm()' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'LinkedApproachWatch.holdAwake(ble.state.value == DkBleManager.State.SESSION_READY,' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'door(lockView.tapLocks)' app/src/main/java/com/openzeekr/app/ui/VehicleScreen.kt
          grep -Fq '!bleLockAuthorized() && !confirmPhysicalDeparture()' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'const val MIN_WEAK_MS = 8_000L' core/src/main/java/com/openzeekr/app/ble/BleDepartureEvidence.kt
          grep -Fq 'const val WALK_AWAY_CONFIRM_MS = 1_200L' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'unlockRoute = if (rssi >= STRONG_NEAR_RSSI) "away_return" else "away_return_steps"' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'decisionPolicy.onFarLinkLossWhileLocked(motion.observedSteps)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'ownKey.decide(name) == OwnKeyNameFilter.Decision.SKIP_OTHER_CAR' core/src/main/java/com/openzeekr/app/ble/DkBleManager.kt
          grep -Fq 'const val FORGET_AFTER_TIMEOUTS = 3' core/src/main/java/com/openzeekr/app/ble/OwnKeyNameFilter.kt
          grep -Fq 'const val CONNECT_FLOOR_RSSI = -94' core/src/main/java/com/openzeekr/app/ble/WeakConnectGate.kt
          grep -Fq 'WeakConnectGate.onPresence(scanResult.rssi, moving)' core/src/main/java/com/openzeekr/app/ble/ProximityService.kt
          grep -Fq 'private const val STATIONARY_LINK_LOSS_CHECK_MS = 100_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private val stepCounter: Sensor? = sensors?.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)' core/src/main/java/com/openzeekr/app/ble/MotionMonitor.kt
          grep -Fq 'internal class StepTally' core/src/main/java/com/openzeekr/app/ble/StepTally.kt
          grep -Fq 'cloudLockWithheldUnverified && userBackAtCar()' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'interface ProximityStateStore' core/src/main/java/com/openzeekr/app/ble/ProximityPorts.kt
          grep -Fq 'LOCKED_WHILE_AWAY' core/src/main/java/com/openzeekr/app/ble/UnlockedSafetyNets.kt
          grep -Fq 'private fun lockVeto(fresh: Int?): String?' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'fun vetoed(smoothedRssi: Int)' core/src/main/java/com/openzeekr/app/ble/BleDepartureRoute.kt
          grep -Fq 'private const val LOCK_LOOP_WAKE_MS = 3 * 60_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val LOSS_NEAR_STALE_READING_MS = 10_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'fun resolvesAlarm(' core/src/main/java/com/openzeekr/app/ble/LockAlertPolicy.kt
          grep -Fq 'internal class SharedVinRemovalPolicy' core/src/main/java/com/openzeekr/app/remote/SharedVinRemovalPolicy.kt
          grep -Fq 'const val MAX_HOLD_MS = 30_000L' core/src/main/java/com/openzeekr/app/ble/rpa/RpaController.kt
          grep -Fq 'object LockAlarmHealth' core/src/main/java/com/openzeekr/app/ble/LockAlarmHealth.kt
          grep -Fq 'edge (plan H10, 0.3.0)' core/src/main/java/com/openzeekr/app/util/DiagnosticExport.kt
          grep -Fq 'object AppBranding' core/src/main/java/com/openzeekr/app/util/AppBranding.kt
          grep -Fq '.setSmallIcon(AppBranding.statusIcon(context))' core/src/main/java/com/openzeekr/app/ble/UnverifiedLockNotifier.kt
          grep -Fq 'internal class PhoneCalibration(' core/src/main/java/com/openzeekr/app/ble/PhoneCalibration.kt
          grep -Fq 'const val REF_APPROACH_DB = -84.7' core/src/main/java/com/openzeekr/app/ble/PhoneCalibration.kt
          grep -Fq 'private val ble: ProximityLink = calibratedLink(ble)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'fun arrivalObserved(smoothedLevel: Int)' core/src/main/java/com/openzeekr/app/ble/BleDepartureEvidence.kt
          grep -Fq 'const val ANCHORED_MIN_STEPS = 20L' core/src/main/java/com/openzeekr/app/ble/BleDepartureEvidence.kt
          grep -Fq 'const val AWAY_RETURN_MIN_STEPS = 15L' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'object SteadyClock' core/src/main/java/com/openzeekr/app/util/SteadyClock.kt
          grep -Fq 'override fun wallMs(): Long = com.openzeekr.app.util.SteadyClock.wallMs()' core/src/main/java/com/openzeekr/app/ble/ProximityPorts.kt
          grep -Fq 'internal class FailedHandshakeDeferral' core/src/main/java/com/openzeekr/app/ble/FailedHandshakeDeferral.kt
          grep -Fq 'internal class ScanStartLimiter' core/src/main/java/com/openzeekr/app/ble/ScanStartLimiter.kt
          grep -Fq 'private fun acquireBridgeWakeLock(timeoutMs: Long)' core/src/main/java/com/openzeekr/app/ble/ProximityService.kt
          grep -Fq 'private const val SETUP_STUCK_MS = 90_000L' core/src/main/java/com/openzeekr/app/ble/ProximityService.kt
          grep -Fq 'val filters = if (screenOn) null else carScanFilters()' core/src/main/java/com/openzeekr/app/ble/DkBleManager.kt
          grep -Fq 'private const val MAX_GNSS_WINDOWS_PER_EPOCH = 6' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val ARMED_STILL_WAKE_MAX_MS = 10 * 60_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'since the first request (walking back)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'CardTitle("Zelfkalibratie")' app/src/main/java/com/openzeekr/app/ui/SettingsScreen.kt
          # 0.3.2: the rules from the simulation audit (step evidence, walk-back return, alarm and cloud checks).
          grep -Fq 'internal class DepartureStepWatch' core/src/main/java/com/openzeekr/app/ble/DepartureStepWatch.kt
          grep -Fq 'internal class StepStallGate(' core/src/main/java/com/openzeekr/app/ble/StepStallGate.kt
          grep -Fq 'internal class StepDeliveryTrace' core/src/main/java/com/openzeekr/app/ble/StepDeliveryTrace.kt
          grep -Fq 'private fun walkedBackToTheCar(' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'const val WALK_BACK_AWAY_ALLOWANCE_STEPS = 12L' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'const val PRESENCE_NEAR_ENTRY_MARGIN_DB = 8' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'const val STILL_APPROACH_STEP_STALL_WINDOW_MS = 10_000L' core/src/main/java/com/openzeekr/app/ble/ProximityDecisionPolicy.kt
          grep -Fq 'const val MAX_SHALLOW_RUN_MS = 2_000L' core/src/main/java/com/openzeekr/app/ble/UnlockedSafetyNets.kt
          grep -Fq 'private suspend fun cloudConfirmsLockedSinceUnlock(' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'if (!armedUnlocked) { _wakeLockNeeded.value = false; farAsleep = true }' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'val bleProofFresh = requestIndex == 0 && bleProofAtMs != 0L &&' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'verifyFreshLockStatus(firstRequestAcceptedSentAtMs)' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'if (walkAwayRecovered) Logx.d("prox", "walk-away: signal recovered -> no location check")' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val STOP_RULE_MAX_STEPS_FROM_CAR = 15L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val EDGE_CLOUD_MARGIN_DB = 8' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val LINK_DEPARTURE_ALERT_HOLD_MS = 30_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'private const val STATIONARY_LINK_LOSS_EARLY_CHECK_MS = 60_000L' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'val counterSteps: Long? get() = null' core/src/main/java/com/openzeekr/app/ble/ProximityPorts.kt
          grep -Fq 'sinceStepMs: Long? = null' core/src/main/java/com/openzeekr/app/ble/KeySleepPolicy.kt
          grep -Fq 'const val MIN_CAR_DB = -80.0' core/src/main/java/com/openzeekr/app/ble/PhoneCalibration.kt
          grep -Fq 'screenOn = { (appContext.getSystemService(android.content.Context.POWER_SERVICE) as? android.os.PowerManager)?.isInteractive })' core/src/main/java/com/openzeekr/app/ble/ProximityController.kt
          grep -Fq 'walk_back|none)' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt
          # 0.3.3: five photo icons; the notification card shows the fixed application icon "Profiel".
          awk '/<application/{f=1} f && /android:icon=/{print; exit}' app/src/main/AndroidManifest.xml | grep -Fq '"@mipmap/ic_launcher_profiel"'
          grep -Fq 'val APPLICATION_ICON = PROFIEL' app/src/main/java/com/openzeekr/app/AppIcon.kt
          grep -Fq 'PROFIEL("LauncherProfiel", R.drawable.ic_stat_profiel),' core/src/main/java/com/openzeekr/app/util/AppBranding.kt
          test "$(grep -c 'android:name=".Launcher' app/src/main/AndroidManifest.xml)" = 11
          # Exactly one launcher alias is enabled by the manifest (LauncherDefault), so an update never adds a second entry.
          test "$(awk '/<activity-alias/{a=1} a && /android:enabled="true"/{n++} /<\/activity-alias>/{a=0} END{print n+0}' app/src/main/AndroidManifest.xml)" = 1
          awk '/android:name=".LauncherDefault"/{f=1} f && /android:enabled=/{print; exit}' app/src/main/AndroidManifest.xml | grep -Fq 'android:enabled="true"'
          # 0.3.4: remote parking is built unavailable (Digital Key 3.0 only) and the test probes are gone.
          grep -Fq 'available = false)' core/src/main/java/com/openzeekr/app/Deps.kt
          grep -Fq 'val available: Boolean = true,' core/src/main/java/com/openzeekr/app/ble/rpa/RpaController.kt
          if grep -q 'fun blindProbe' core/src/main/java/com/openzeekr/app/ble/rpa/RpaController.kt; then echo 'blind probe is back'; exit 1; fi
          if grep -q 'probeControl' core/src/main/java/com/openzeekr/app/ble/DkSession.kt; then echo 'probeControl is back'; exit 1; fi
          grep -Fq 'val sensitivityUnlockRssi: Int get() = FAR_UNLOCK_RSSI' core/src/main/java/com/openzeekr/app/config/SecretsConfig.kt

      - name: Verify read-only diagnostic entry point
        run: |
          grep -Fq 'Text(if (observingCapabilities) "Reading vehicle capabilities…" else "Read vehicle capabilities")' app/src/main/java/com/openzeekr/app/ui/SettingsScreen.kt
          grep -Fq 'vehicleCapabilityDiagnostic()' core/src/main/java/com/openzeekr/app/remote/Repositories.kt
          grep -Fq 'VEHICLE_CAPABILITIES' core/src/main/java/com/openzeekr/app/util/ProximityDiagnosticJournal.kt

      - name: Verify permanent phone signing identity
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          EXPECTED="96f1627b1da334cb443596b1746bcce390750f1db751ec2bf371e82d323b45b9"
          APK=app/build/outputs/apk/debug/app-debug.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fqi "certificate SHA-256 digest: $EXPECTED"

      - name: Verify built phone APK identity and SHA-256
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.openzeekr.app.test' versionCode='129' versionName='0.3.5-work'"
          printf '%s\n' "$BADGING" | grep -E "^application: label='ZeekRemote' icon='[^']*ic_launcher_profiel[^']*'"
          printf '%s\n' "$BADGING" | grep -Fx "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fx "targetSdkVersion:'34'"
          sha256sum "$APK"

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeekRemote-phone-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
